[tools]
node = "24.15.0"
"npm:pnpm" = { version = "11.0.3", depends = "node" }

[env]
_.file = ".env"

[tasks."dev:template"]
run = "pnpm dev"

[tasks."dev:haqumei-api"]
dir = "../haqumei-api"
run = """
url="${HAQUMEI_API_URL:-http://127.0.0.1:8080}"
if curl -fsS --max-time 2 "${url}/health/live" > /dev/null 2>&1; then
  echo "haqumei-api is already running at ${url}, skipping start"
else
  case "${url}" in
    http://127.0.0.1* | http://localhost*)
      mise exec -- cargo run -p haqumei-api
      ;;
    *)
      # Remote host (e.g. the mini PC): a local server would not be used.
      echo "haqumei-api is not reachable at ${url}; start it on that host" >&2
      ;;
  esac
fi
"""

[tasks.dev]
depends = ["dev:template", "dev:haqumei-api"]
